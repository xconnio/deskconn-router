services:
  deskconn-router:
    image: xconnio/deskconn-router:latest
    container_name: deskconn-router
    env_file:
      - .env
    environment:
      DESKCONN_POSTGRES_HOST: host.docker.internal
      DESKCONN_ROUTER_WT_HASH_ADDRESS: 0.0.0.0:8083
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
      - "8081:8081/udp"
      - "8082:8082/udp"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped

networks:
  default:
    name: deskconn-router-network
